    <script>
        const isCanvasEmbed = new URLSearchParams(location.search).get('embed') === 'canvas';
        const canvasAgentWorkspaceState = window.CanvasAgentChatClient.createCanvasAgentWorkspaceState();
        const creativeAgentWorkspaceState = window.CanvasAgentChatClient.createCreativeAgentWorkspaceState();
        const canvasAgentContextRequester = isCanvasEmbed && window.parent !== window
            ? window.CanvasAgentChatClient.createCanvasAgentContextRequester({
                windowRef:window,
                parentRef:window.parent,
                origin:location.origin,
                timeoutMs:5000,
            })
            : null;
        function workspaceMode(){ return isCanvasEmbed ? 'creative' : 'normal'; }
        function closeCanvasEmbed(){
            if(!isCanvasEmbed || window.parent === window) return;
            parent.postMessage({type:'canvas-chat-close'}, location.origin);
        }
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.addEventListener('message', event => {
            if(event.origin !== location.origin || event.source !== window.parent) return;
            if(event.data?.canvas_id) canvasAgentCanvasId = String(event.data.canvas_id);

            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const width = Math.min(380, Math.max(300, viewportW - 32));
            const estimatedHeight = Math.min(390, Math.max(260, viewportH * .62));
            const availableAbove = Math.max(180, rect.top - 14);
            const maxHeight = Math.min(390, availableAbove, viewportH - 32);
            const left = Math.min(Math.max(16, rect.left), Math.max(16, viewportW - width - 16));
            const top = Math.max(12, rect.top - maxHeight - 10);
            pop.style.setProperty('--model-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(16, top))}px`);
            pop.style.setProperty('--model-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--model-picker-max-height', `${Math.round(maxHeight)}px`);
            requestAnimationFrame(() => {
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--model-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });

        function positionResolutionPicker(){
            const btn = document.getElementById('resolutionPickerBtn');
            const pop = document.getElementById('resolutionPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const desiredWidth = chatResolution === 'auto' ? 300 : (chatResolution === 'custom' ? 340 : 420);
            const width = Math.min(desiredWidth, Math.max(260, viewportW - 32));
            const safeX = 12;
            const safeTop = 12;
            const safeBottom = 18;
            const gap = 10;
            const left = Math.min(Math.max(safeX, rect.left + rect.width / 2 - width / 2), Math.max(safeX, viewportW - width - safeX));
            const availableAbove = Math.max(96, rect.top - safeTop - gap);
            const initialHeight = Math.min(chatResolution === 'auto' ? 220 : 390, availableAbove, viewportH - safeTop - safeBottom);
            const initialTop = Math.max(safeTop, rect.top - initialHeight - gap);

        function chatResolutionForRequest(message, requestedSize){
            if(['1k','2k','4k'].includes(chatResolution)) return chatResolution;
            const text = String(message || '');
            if(/4\s*k|4K|超清|超高分辨率/i.test(text)) return '4k';
            if(/2\s*k|2K|高清|高分辨率/i.test(text)) return '2k';
            const edge = Math.max(...String(requestedSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            if(edge >= 2800) return '4k';
            if(edge >= 1600) return '2k';
            return '1k';
        }

        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            const text = String(message || '');
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct) {
                const w = Number(direct[2]);
                const h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|9|16)\s*:\s*(1|2|3|4|9|16)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants4k = /4\s*k|4K|超清|超高分辨率/i.test(text);
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            if(chatResolution === 'custom' && !wants4k && !wants2k) return fallbackSize;
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants4k ? '4k' : (wants2k ? '2k' : (chatResolution === 'auto' ? '1k' : (fallbackEdge >= 2400 ? '4k' : (fallbackEdge >= 1500 ? '2k' : '1k'))));
            return (SIZE_OPTIONS[key] || SIZE_OPTIONS.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

        function addMessageBubble(msg){
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const bubble = document.createElement('div');

            const media = Array.isArray(msg.media) && msg.media.length

                : imageUrls.map(url => ({url, kind:'image', name:'生成图片'}));
            if(media.length) bubble.classList.add('image-bubble');
            const text = document.createElement('div');
            text.textContent = msg.type === 'image' ? (msg.agent_reply || tr('chat.generated')) : (msg.content || '');
            text.className = 'bubble-text';
            bubble.appendChild(text);
            if(msg.attachments?.length){
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';
                msg.attachments.forEach(ref => {
                    const thumb = renderAttachmentThumb(ref);
                    thumbs.appendChild(thumb);
                });
                bubble.appendChild(thumbs);
            }
            if(media.length){
                const grid = document.createElement('div');
                grid.className = `generated-grid count-${Math.min(media.length, 4)}`;
                media.forEach(item => {
                    if(item.kind === 'video'){
                        const video = document.createElement('video');
                        video.className = 'generated';
                        video.src = item.url;
                        video.controls = true;
                        video.playsInline = true;
                        grid.appendChild(video);
                        return;
                    }
                    const image = document.createElement('img');
                    image.className = 'generated';
                    image.src = item.url;
                    image.onclick = () => openImagePreview(item.url);
                    grid.appendChild(image);
                });
                bubble.appendChild(grid);
                if(isCanvasEmbed && msg.role === 'assistant') bubble.appendChild(createCreativeResultActions(msg, media));
            }
            // Show model badge for assistant messages
            if(msg.role === 'assistant' && msg.model){

                badge.textContent = modelShort;

        function insertCreativeMediaIntoCanvas(message, media, button){
            if(!isCanvasEmbed || window.parent === window || !canvasAgentCanvasId) return;
            const requestId = uuid();
            button.disabled = true;
            button.textContent = '正在放入…';
            creativePendingInsertions.set(requestId, button);
            parent.postMessage({
                type:'canvas-creative-agent-insert-media',
                request_id:requestId,
                canvas_id:canvasAgentCanvasId,
                media,
                optimized_prompt:message.optimized_prompt || message.content || '',
            }, location.origin);
            setTimeout(() => {
                if(!creativePendingInsertions.has(requestId)) return;
                creativePendingInsertions.delete(requestId);
                button.disabled = false;
                button.textContent = '放入失败，请重试';
            }, 8000);
        }

        function isImageRef(ref){
            const kind = String(ref?.kind || '').toLowerCase();
            const mime = String(ref?.mime || '').toLowerCase();
            const url = String(ref?.url || '').toLowerCase();
            return kind === 'image' || mime.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|tiff?)(\?|#|$)/.test(url);
        }

            if(isImageRef(ref)){

                img.onclick = () => openImagePreview(ref.url);

        function renderRefChip(ref, i){

                return `<div class="ref-chip"><img src="${escapeHtml(ref.url)}" title="${escapeHtml(attachmentName(ref))}">${isCanvasEmbed ? `<span class="creative-ref-marker">@${escapeHtml(ref.marker || `图片${i + 1}`)}</span>` : ''}<button onclick="removeRef(${i})">×</button></div>`;
            }
            return `<div class="ref-chip file"><i data-lucide="file"></i><span class="ref-file-name" title="${escapeHtml(attachmentName(ref))}">${escapeHtml(attachmentName(ref))}</span><button onclick="removeRef(${i})">×</button></div>`;

        async function uploadFiles(files){
            if(!files?.length) return;
            const available = Math.max(0, CHAT_ATTACHMENT_MAX - refs.length);
            if(!available) return;
            const form = new FormData();
            [...files].slice(0, available).forEach(file => form.append('files', file));
            try {
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || '上传失败'); return r.json(); });
                const knownUrls = new Set(refs.map(item => item.url));
                const uploaded = (data.files || []).filter(item => (!isCanvasEmbed || isImageRef(item)) && item?.url && !knownUrls.has(item.url) && knownUrls.add(item.url));
                refs.push(...uploaded.map((item,index) => ({...item, marker:nextCreativeMarker(index)})));
                renderRefs();
            } catch(e) {
                alert(e.message || '上传失败');
            }
        }

        function renderRefs(){
            const strip = document.getElementById('refStrip');
            strip.innerHTML = refs.map((ref,i) => renderRefChip(ref, i)).join('');
            lucide.createIcons();
            updateComposerOverflow();
        }

        function removeRef(i){ refs.splice(i,1); renderRefs(); }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])].filter(x => x.kind === 'file').map(x => x.getAsFile()).filter(Boolean);

        });

            e.preventDefault();
            composerBody.classList.add('drag-over');
        });
        composerBody.addEventListener('dragleave', e => {
            if(!composerBody.contains(e.relatedTarget)) composerBody.classList.remove('drag-over');
        });
        composerBody.addEventListener('drop', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.remove('drag-over');
            const files = [...(e.dataTransfer?.files || [])];
            uploadFiles(files);
        });

        function hasUploadFiles(items){ return [...(items || [])].some(item => item.kind === 'file'); }
        function updateComposerOverflow(){

        async function waitForCreativeCanvasId(){
            if(canvasAgentCanvasId) return canvasAgentCanvasId;
            requestCreativeMediaCatalog();
            const started = Date.now();
            while(!canvasAgentCanvasId && Date.now() - started < 3000) await new Promise(resolve => setTimeout(resolve, 40));
            if(!canvasAgentCanvasId) throw new Error('画布尚未加载完成，请稍后重新发送。');
            return canvasAgentCanvasId;

        async function sendCanvasCreativeAgentMessage(){
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if(creativeAgentBusy){ creativeAbortController?.abort(); return; }
            if(!message) return;
            const button = document.getElementById('sendBtn');
            let assistantBubble = null;
            let context = null;
            setCanvasWorkspaceBusy(true);
            creativeAbortController = new AbortController();
            closeCreativePopovers();
            try {
                await waitForCreativeCanvasId();
                if(window.CanvasAgentChatClient.shouldRequestCreativeCanvasContext(message)){
                    context = await requestCanvasAgentContext();
                    if(context.canvas.id !== canvasAgentCanvasId) throw new Error('画布已经切换，请重新发送。');
                }
                const pendingRefs = window.CanvasAgentChatClient.resolveCreativeAgentReferences(message, refs).slice(0, CHAT_ATTACHMENT_MAX);
                refs = [];
                renderRefs();
                input.value = '';
                autoGrow(input);
                if(!currentConversation){
                    currentConversation = {id:'', kind:'canvas_creative_agent', canvas_id:canvasAgentCanvasId, title:'新对话', messages:[]};
                    document.getElementById('messages').innerHTML = '';
                }
                addMessageBubble({role:'user', content:message, attachments:pendingRefs, mode:creativeMode()});
                assistantBubble = addMessageBubble({role:'assistant', content:'正在分析要求…'});
                assistantBubble.bubble.classList.add('streaming');
                scrollBottom();
                const brainModel = provider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : (activeChatModel || config.chat_model);
                const response = await fetch('/api/chat/canvas-creative-agent/stream', {
                    method:'POST', headers:headers(), body:JSON.stringify({
                        conversation_id:currentConversation.id || '',
                        canvas_id:canvasAgentCanvasId,
                        mode:creativeMode(),
                        message,
                        system_prompt:currentSystemPrompt(),
                        brain_provider:provider,
                        brain_model:brainModel,
                        brain_ms_model:provider === 'modelscope' ? brainModel : '',
                        image_candidates:creativeImageCandidates,
                        video_candidates:creativeVideoCandidates,
                        preferences:creativePreferences,
                        reference_images:pendingRefs,
                        canvas_context:context,
                    }), signal:creativeAbortController.signal,
                });
                if(!response.ok) throw new Error((await response.json()).detail || tr('chat.requestFailed'));
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullText = '';
                while(true){
                    const {value, done} = await reader.read();
                    if(done) break;
                    buffer += decoder.decode(value, {stream:true});
                    const chunks = buffer.split('\n\n');
                    buffer = chunks.pop() || '';
                    for(const chunk of chunks){
                        const line = chunk.split('\n').find(item => item.startsWith('data:'));
                        if(!line) continue;
                        const event = JSON.parse(line.slice(5).trim());
                        if(event.type === 'meta'){
                            currentConversation = event.conversation;
                            rememberCanvasAgentConversation(currentConversation.id);
                            setChatTitle(currentConversation.title);
                        } else if(event.type === 'stage'){
                            document.getElementById('canvasAgentContextStatus').textContent = event.message || '正在处理…';
                            assistantBubble.text.innerHTML = `<span class="creative-stage">${escapeHtml(event.message || '正在处理…')}</span>`;
                        } else if(event.type === 'delta'){
                            fullText += event.delta || '';
                            assistantBubble.text.textContent = fullText;
                        } else if(event.type === 'tool_plan'){
                            assistantBubble.text.textContent = `已优化提示词，正在使用 ${shortModelName(event.model)} 生成…`;
                        } else if(event.type === 'error'){
                            throw new Error(event.detail || tr('chat.requestFailed'));
                        } else if(event.type === 'done'){
                            currentConversation = event.conversation;
                            rememberCanvasAgentConversation(currentConversation.id);
                            setChatTitle(currentConversation.title);
                            renderMessages(currentConversation.messages || []);
                            await loadConversations();
                        }
                        scrollBottom();
                    }
                }
                assistantBubble.bubble.classList.remove('streaming');
            } catch(error){
                const detail = error?.name === 'AbortError'
                    ? '已停止本地等待；若平台不支持远程取消，官网任务可能仍在运行。'
                    : (error?.message || tr('chat.requestFailed'));
                if(assistantBubble){ assistantBubble.bubble.classList.remove('streaming'); assistantBubble.text.textContent = detail; }
                else alert(detail);
            } finally {
                creativeAbortController = null;
                setCanvasWorkspaceBusy(false);
                scrollBottom();
            }
        }

                            scrollBottom();
                        }
                        if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                        if(event.type === 'done'){
                            assistantBubble.bubble.classList.remove('streaming');
                            currentConversation = event.conversation;
                            rememberCanvasAgentConversation(currentConversation.id);
                            setChatTitle(currentConversation.title);
                            renderMessages(currentConversation.messages || []);
                            await loadConversations();
                        }
                    }
                }
                assistantBubble.bubble.classList.remove('streaming');
            } catch(error){
                const messageText = error?.message || tr('chat.requestFailed');
                if(assistantBubble){
                    assistantBubble.bubble.classList.remove('streaming');
                    assistantBubble.text.textContent = messageText;
                } else {
                    updateCanvasAgentContextStatus(null, messageText);
                }
            } finally {
                btn.disabled = false;
                setCanvasWorkspaceBusy(false);
                scrollBottom();
            }
        }

        async function sendMessage(){
            if(isCanvasEmbed) return sendCanvasCreativeAgentMessage();
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if(!message) return;
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            const requestedSize = chatSizeFromPrompt(message);
            const pendingRefs = refs.slice();
            refs = [];
            renderRefs();
            input.value = '';
            autoGrow(input);
            if(!currentConversation){
                currentConversation = {id:'', title:'新对话', messages:[]};
                document.getElementById('messages').innerHTML = '';
            }
            addMessageBubble({role:'user', content:message, attachments:pendingRefs});
            const useStreaming = mode === 'chat';
            const pendingText = mode === 'image' ? tr('chat.generatingImage') : (useStreaming ? '' : (mode === 'agent' ? tr('chat.agentWorking') : ''));
            const assistantBubble = addMessageBubble({role:'assistant', content: pendingText});
            if(useStreaming || mode === 'agent') assistantBubble.bubble.classList.add('streaming');
            scrollBottom();
            try {
                const requestResolution = chatResolutionForRequest(message, requestedSize);
                const requestAspectRatio = currentChatAspectRatio();
                if(useStreaming) {
                    await streamChatMessage(message, pendingRefs, assistantBubble);
                } else if(mode === 'chat') {
                    const data = await fetch('/api/chat', {
                        method:'POST',
                        headers:headers(),
                        body:JSON.stringify({
                            conversation_id: currentConversation.id || '',
                            message,
                            system_prompt: currentSystemPrompt(),
                            mode:'chat',
                            size: requestedSize,
                            aspect_ratio: requestAspectRatio,
                            resolution: requestResolution,
                            model: provider === 'modelscope' ? (msModel || activeChatModel) : (activeChatModel || config.chat_model),
                            ms_model: provider === 'modelscope' ? (msModel || activeChatModel) : '',
                            reference_images: pendingRefs,
                            provider,
                        })
                    }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || tr('chat.requestFailed')); return r.json(); });
                    currentConversation = data.conversation;
                    rememberConversation(currentConversation.id);
                    setChatTitle(currentConversation.title);
                    renderMessages(currentConversation.messages || []);
                    await loadConversations();
                } else if(mode === 'agent') {
                    const data = await fetch('/api/chat/agent', {
                        method:'POST',
                        headers:headers(),
                        body:JSON.stringify({
                            conversation_id: currentConversation.id || '',
                            message,
                            system_prompt: currentSystemPrompt(),
                            mode:'agent',
                            size: requestedSize,
                            aspect_ratio: requestAspectRatio,
                            resolution: requestResolution,
                            model: provider === 'modelscope' ? (msModel || activeChatModel) : (activeChatModel || config.chat_model),
                            ms_model: provider === 'modelscope' ? (msModel || activeChatModel) : '',
                            image_model: activeImageModel || config.image_model,
                            reference_images: pendingRefs,
                            provider,
                            image_provider: activeImageProvider,
                        })
                    }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || tr('chat.requestFailed')); return r.json(); });
                    currentConversation = data.conversation;
                    rememberConversation(currentConversation.id);
                    setChatTitle(currentConversation.title);
                    renderMessages(currentConversation.messages || []);
                    await loadConversations();
                } else {
                    const data = await fetch('/api/chat', {
                        method:'POST',
                        headers:headers(),
                        body:JSON.stringify({
                            conversation_id: currentConversation.id || '',
                            message,
                            system_prompt: currentSystemPrompt(),
                            mode,
                            size: requestedSize,
                            aspect_ratio: requestAspectRatio,
                            resolution: requestResolution,
                            model: activeChatModel || config.chat_model,
                            image_model: activeImageModel || config.image_model,
                            reference_images: pendingRefs,
                            provider: activeImageProvider,
                        })
                    }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || tr('chat.requestFailed')); return r.json(); });
                    currentConversation = data.conversation;
                    rememberConversation(currentConversation.id);
                    setChatTitle(currentConversation.title);
                    renderMessages(currentConversation.messages || []);
                    await loadConversations();
                }
            } catch(err) {
                renderMessages([...(currentConversation.messages || []), {role:'assistant', content:err.message || tr('chat.requestFailed')}]);
            } finally {
                btn.disabled = false;
                scrollBottom();
            }
        }

        async function streamChatMessage(message, pendingRefs, assistantBubble){
            const currentProvider = provider;
            const currentMsModel = provider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : '';
            const currentChatModel = activeChatModel || config.chat_model;

            const res = await fetch('/api/chat/stream', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    system_prompt: currentSystemPrompt(),
                    mode:'chat',
                    model: currentProvider === 'modelscope' ? currentMsModel : currentChatModel,
                    ms_model: currentProvider === 'modelscope' ? currentMsModel : '',
                    provider: currentProvider,
                    reference_images: pendingRefs
                })
            });
            if(!res.ok) throw new Error((await res.json()).detail || tr('chat.requestFailed'));
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            while(true){
                const {value, done} = await reader.read();
                if(done) break;
                buffer += decoder.decode(value, {stream:true});
                const events = buffer.split('\n\n');
                buffer = events.pop() || '';
                for(const eventText of events){
                    const line = eventText.split('\n').find(item => item.startsWith('data:'));
                    if(!line) continue;
                    const event = JSON.parse(line.slice(5).trim());
                    if(event.type === 'meta'){
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                    }
                    if(event.type === 'delta'){
                        fullText += event.delta || '';
                        assistantBubble.text.textContent = fullText;
                        scrollBottom();
                    }
                    if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                    if(event.type === 'done'){
                        assistantBubble.bubble.classList.remove('streaming');
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                        renderMessages(currentConversation.messages || []);
                        await loadConversations();
                    }
                }
            }
            assistantBubble.bubble.classList.remove('streaming');
        }

        function scrollBottom(){ requestAnimationFrame(() => { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }); }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            syncSystemPromptUI();
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            await loadConfig();
            if(isCanvasEmbed) syncCanvasWorkspaceUI();
            await loadConversations();
            updateComposerOverflow();
        };
        window.addEventListener('beforeunload', () => canvasAgentContextRequester?.dispose());
    </script>
